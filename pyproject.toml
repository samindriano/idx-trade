[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idx-trade-research"
version = "0.1.0"
description = "Point-in-time IDX daily trade setup research"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=18,<25",
  "pypdf>=5,<7",
  "lxml>=5,<7",
  "requests>=2.32,<3",
  "scikit-learn>=1.5,<2",
  "xgboost==3.2.1",
  "yfinance>=0.2.54,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
