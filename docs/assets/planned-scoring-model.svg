<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690">
<rect width="1200" height="690" fill="#ffffff"/>
<defs>
  <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#334155"/></marker>
  <style>
    .txt{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a}
    .title{font-size:20px;font-weight:700}.label{font-size:16px;font-weight:600}.small{font-size:13px}.edge{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<text x="50" y="42" class="txt title">Planned setup-scoring model</text>
<text x="50" y="66" class="txt small" fill="#dc2626">Design target only — not implemented while DATA GATE is blocked.</text>
<rect x="55" y="115" width="195" height="70" rx="11" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
<text x="152.5" y="143" text-anchor="middle" class="txt label">Eligible PIT universe</text>
<text x="152.5" y="164" text-anchor="middle" class="txt small">liquidity + IPO + tradability</text>
<path d="M250 150 H295" class="edge"/>
<rect x="300" y="105" width="210" height="90" rx="11" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="405" y="136" text-anchor="middle" class="txt label">Technical price layer</text>
<text x="405" y="158" text-anchor="middle" class="txt small">split-adjusted OHLC</text>
<text x="405" y="178" text-anchor="middle" class="txt small">raw prices retained for execution</text>
<path d="M510 150 H555" class="edge"/>
<rect x="560" y="105" width="210" height="90" rx="11" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="665" y="136" text-anchor="middle" class="txt label">S/R structure engine</text>
<text x="665" y="158" text-anchor="middle" class="txt small">support / resistance zones</text>
<text x="665" y="178" text-anchor="middle" class="txt small">trend + breakout context</text>
<path d="M770 150 H815" class="edge"/>
<rect x="820" y="105" width="320" height="90" rx="11" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
<text x="980" y="136" text-anchor="middle" class="txt label">Setup generator</text>
<text x="980" y="158" text-anchor="middle" class="txt small">entry • invalidation / stop • target</text>
<text x="980" y="178" text-anchor="middle" class="txt small">raw risk/reward + execution constraints</text>
<path d="M980 195 V250" class="edge"/>
<rect x="165" y="250" width="870" height="105" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="600" y="278" text-anchor="middle" class="txt label">Causal feature set at signal time</text>
<text x="600" y="304" text-anchor="middle" class="txt small">distance to S/R • trend • ATR / volatility • volume/liquidity • gap • relative strength • IHSG/market regime</text>
<text x="600" y="327" text-anchor="middle" class="txt small">No future information. Cross-sectional features use the point-in-time eligible universe only.</text>
<path d="M600 355 V400" class="edge"/>
<rect x="180" y="405" width="350" height="100" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
<text x="355" y="436" text-anchor="middle" class="txt label">Outcome / probability model</text>
<text x="355" y="460" text-anchor="middle" class="txt small">P(TP before SL)</text>
<text x="355" y="482" text-anchor="middle" class="txt small">+ calibrated reliability / uncertainty</text>
<rect x="670" y="405" width="350" height="100" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="845" y="436" text-anchor="middle" class="txt label">Payoff model</text>
<text x="845" y="460" text-anchor="middle" class="txt small">realized R • expected R • time-to-event</text>
<text x="845" y="482" text-anchor="middle" class="txt small">same-bar ambiguity handled explicitly</text>
<path d="M355 505 V545 H535" class="edge"/><path d="M845 505 V545 H665" class="edge"/>
<rect x="500" y="530" width="200" height="70" rx="11" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="600" y="558" text-anchor="middle" class="txt label">Opportunity output</text>
<text x="600" y="581" text-anchor="middle" class="txt small">score + probability + reliability</text>
<path d="M500 565 H390" class="edge"/><path d="M700 565 H810" class="edge"/>
<rect x="115" y="535" width="275" height="82" rx="11" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="252.5" y="565" text-anchor="middle" class="txt label">Risk sizing</text>
<text x="252.5" y="588" text-anchor="middle" class="txt small">fractional Kelly + hard portfolio caps</text>
<rect x="810" y="535" width="275" height="82" rx="11" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
<text x="947.5" y="565" text-anchor="middle" class="txt label">Robustness simulation</text>
<text x="947.5" y="588" text-anchor="middle" class="txt small">Monte Carlo / bootstrap / drawdown</text>
<text x="600" y="660" text-anchor="middle" class="txt small" fill="#475569">Intended user-facing result: setup geometry + RR + P(TP before SL) + Opportunity Score + estimate reliability + conservative position-size guidance.</text>
</svg>