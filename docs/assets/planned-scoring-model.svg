<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="820" viewBox="0 0 1320 820">
  <defs>
    <marker id="arrow-navy" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <style>
      .title { font: 700 18px Arial, sans-serif; fill:#0f172a; }
      .subtitle { font: 13px Arial, sans-serif; fill:#475569; }
      .section { font: 700 12px Arial, sans-serif; fill:#334155; }
      .label { font: 700 12px Arial, sans-serif; fill:#0f172a; }
      .small { font: 11px Arial, sans-serif; fill:#475569; }
      .tiny { font: 10px Arial, sans-serif; fill:#475569; }
      .center { text-anchor: middle; dominant-baseline: middle; }
      .box { fill:#ffffff; stroke-width:2; rx:12; ry:12; }
      .group { fill:#f8fafc; stroke:#94a3b8; stroke-width:1.5; rx:14; ry:14; }
      .dashed { fill:#f8fafc; stroke:#94a3b8; stroke-width:1.5; stroke-dasharray:6 5; rx:14; ry:14; }
      .arrowN { stroke:#334155; stroke-width:2.4; fill:none; marker-end:url(#arrow-navy); stroke-linecap:round; stroke-linejoin:round; }
      .arrowG { stroke:#16a34a; stroke-width:2.4; fill:none; marker-end:url(#arrow-green); stroke-linecap:round; stroke-linejoin:round; }
      .arrowR { stroke:#dc2626; stroke-width:2.4; fill:none; marker-end:url(#arrow-red); stroke-linecap:round; stroke-linejoin:round; }
      .chip { fill:#fff7ed; stroke:#f59e0b; stroke-width:1.5; rx:8; ry:8; }
      .status { fill:#fee2e2; stroke:#ef4444; stroke-width:1.5; rx:8; ry:8; }
    </style>
  </defs>
<rect x="0" y="0" width="1320" height="820" fill="white"/>
<text x="40" y="40" class="title">Planned setup-scoring model</text>
<text x="40" y="62" class="subtitle">Design target only — not implemented while the Data Gate is blocked.</text>
<rect x="40" y="120" width="210" height="60" class="box" style="stroke:#0891b2; fill:#ecfeff;" />
<text x="145.0" y="140" class="label center">Eligible PIT universe</text>
<text x="145.0" y="162" class="small center">liquidity + IPO + tradability</text>
<rect x="285" y="120" width="210" height="60" class="box" style="stroke:#2563eb; fill:#eff6ff;" />
<text x="390.0" y="140" class="label center">Technical price layer</text>
<text x="390.0" y="162" class="small center"><tspan x="390.0" dy="-7">split-adjusted OHLC</tspan><tspan x="390.0" dy="14">raw prices retained for execution</tspan></text>
<rect x="530" y="120" width="210" height="60" class="box" style="stroke:#7c3aed; fill:#f5f3ff;" />
<text x="635.0" y="140" class="label center">S/R structure engine</text>
<text x="635.0" y="162" class="small center"><tspan x="635.0" dy="-7">support / resistance zones</tspan><tspan x="635.0" dy="14">trend + breakout context</tspan></text>
<rect x="775" y="120" width="210" height="60" class="box" style="stroke:#d97706; fill:#fff7ed;" />
<text x="880.0" y="140" class="label center">Setup generator</text>
<text x="880.0" y="162" class="small center"><tspan x="880.0" dy="-7">entry · invalidation / stop · target</tspan><tspan x="880.0" dy="14">raw risk/reward + execution constraints</tspan></text>
<path d="M250 150 H285" class="arrowN"/>
<path d="M495 150 H530" class="arrowN"/>
<path d="M740 150 H775" class="arrowN"/>
<path d="M985 180 V225" class="arrowN"/>
<rect x="170" y="225" width="980" height="95" class="group"/>
<text x="660" y="251" class="label center">Causal feature set at signal time</text>
<text x="660" y="279" class="small center"><tspan x="660" dy="-7">distance to S/R · trend + ATR / volatility · volume/liquidity · gap · relative strength · IHSG/market regime</tspan><tspan x="660" dy="14">No future information. Cross-sectional features use the point-in-time eligible universe only.</tspan></text>
<path d="M660 320 V360" class="arrowN"/>
<rect x="230" y="360" width="330" height="100" class="box" style="stroke:#4f46e5; fill:#eef2ff;" />
<text x="395" y="385" class="label center">Outcome / probability model</text>
<text x="395" y="417" class="small center"><tspan x="395" dy="-7">P(TP before SL)</tspan><tspan x="395" dy="14">+ calibrated reliability / uncertainty</tspan></text>
<rect x="760" y="360" width="330" height="100" class="box" style="stroke:#16a34a; fill:#f0fdf4;" />
<text x="925" y="385" class="label center">Payoff model</text>
<text x="925" y="417" class="small center"><tspan x="925" dy="-7">realized R · expected R · time-to-event</tspan><tspan x="925" dy="14">same-bar ambiguity handled explicitly</tspan></text>
<path d="M660 320 V340 H395 V360" class="arrowN"/>
<path d="M660 320 V340 H925 V360" class="arrowN"/>
<rect x="500" y="505" width="320" height="70" class="box" style="stroke:#d97706; fill:#fffaf0;" />
<text x="660" y="528" class="label center">Opportunity output</text>
<text x="660" y="550" class="small center"><tspan x="660" dy="-7">score + probability + reliability</tspan><tspan x="660" dy="14">+ raw reward/risk context</tspan></text>
<path d="M395 460 V490 H660 V505" class="arrowN"/>
<path d="M925 460 V490 H660 V505" class="arrowN"/>
<rect x="220" y="620" width="270" height="78" class="box" style="stroke:#ef4444; fill:#fff1f2;" />
<text x="355" y="645" class="label center">Risk sizing</text>
<text x="355" y="668" class="small center"><tspan x="355" dy="-7">fractional Kelly</tspan><tspan x="355" dy="14">+ hard portfolio caps</tspan></text>
<rect x="830" y="620" width="300" height="78" class="box" style="stroke:#06b6d4; fill:#ecfeff;" />
<text x="980" y="645" class="label center">Robustness simulation</text>
<text x="980" y="668" class="small center"><tspan x="980" dy="-7">Monte Carlo / bootstrap / drawdown</tspan><tspan x="980" dy="14">and scenario stress tests</tspan></text>
<path d="M620 575 V600 H355 V620" class="arrowN"/>
<path d="M700 575 V600 H980 V620" class="arrowN"/>
<text x="660" y="760" class="small center">Intended user-facing result: setup geometry + RR + P(TP before SL) + Opportunity Score + estimated reliability + conservative position-size guidance.</text>
</svg>