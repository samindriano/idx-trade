name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check src tests
      - name: Data-contract smoke tests
        run: >-
          python -m pytest
          tests/test_data_gate.py
          tests/test_idx_sessions_provider.py
          tests/test_tradability_reconciliation.py
          tests/test_adversarial_data_gate.py
      - name: Full test suite
        run: python -m pytest
