name: Official Open R2 storage smoke

on:
  push:
    branches: [ops/idx-official-open-r2-cloud-capture-v1]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install archive dependency
        run: python -m pip install --upgrade pip && python -m pip install -e ".[archive]"
      - name: Immutable R2 write/read/hash smoke
        shell: bash
        run: |
          python - <<'PY'
          import os
          from idx_trade.stockbit_stream_archive import S3ImmutableStore, sha256_bytes

          run_id = os.environ["GITHUB_RUN_ID"]
          payload = ("official-open-r2-storage-smoke:" + run_id + "\n").encode()
          store = S3ImmutableStore(
              os.environ["R2_ENDPOINT"],
              os.environ["R2_BUCKET"],
              os.environ["R2_ACCESS_KEY_ID"],
              os.environ["R2_SECRET_ACCESS_KEY"],
              "official-open-smoke-v1",
          )
          key = f"run_id={run_id}/witness.txt"
          result = store.put_if_absent(key, payload, "text/plain")
          confirmed = store.read(key)
          assert confirmed == payload
          assert result.sha256 == sha256_bytes(payload)
          print(f"R2_STORAGE_SMOKE_PASS key={key} sha256={result.sha256}")
          PY
