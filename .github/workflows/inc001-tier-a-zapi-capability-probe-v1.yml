name: INC001 Tier A ZAPI CA capability probe V1

on:
  push:
    branches: [data/ca-aware-feature-basis-remediation-v1]
    paths: [.github/workflows/inc001-tier-a-zapi-capability-probe-v1.yml]
  pull_request:
    paths: [.github/workflows/inc001-tier-a-zapi-capability-probe-v1.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ZAPI_API_KEY: ${{ secrets.ZAPI_API_KEY }}
    steps:
      - name: Require ZAPI secret
        run: test -n "$ZAPI_API_KEY"

      - name: Run read-only control and unresolved probes
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, urllib.error, urllib.parse, urllib.request

          key = os.environ["ZAPI_API_KEY"]
          root = pathlib.Path("tier-a-zapi-probe")
          raw = root / "raw"
          raw.mkdir(parents=True, exist_ok=True)

          targets = [
            ("RIGHTS_HMETD","RESOLVED_CONTROL","MPPA",2026,6,"rights-offerings","2026-06-26","REGULAR_MARKET_EX_DATE"),
            ("RIGHTS_HMETD","RESOLVED_CONTROL","GMFI",2025,12,"rights-offerings","2025-12-22","REGULAR_MARKET_EX_DATE"),
            ("RIGHTS_HMETD","UNRESOLVED_PROBE","SGER",2024,5,"rights-offerings","","REGULAR_MARKET_EX_DATE"),
            ("RIGHTS_HMETD","UNRESOLVED_PROBE","PACK",2026,1,"rights-offerings","","REGULAR_MARKET_EX_DATE"),
            ("STOCK_SPLIT","RESOLVED_CONTROL","AKRA",2022,1,"stock-splits","2022-01-12","REGULAR_MARKET_FIRST_NEW_BASIS_TRADING_DATE"),
            ("STOCK_SPLIT","RESOLVED_CONTROL","AMOR",2021,12,"stock-splits","2021-12-08","REGULAR_MARKET_FIRST_NEW_BASIS_TRADING_DATE"),
            ("STOCK_SPLIT","UNRESOLVED_PROBE","BMRI",2023,4,"stock-splits","","REGULAR_MARKET_FIRST_NEW_BASIS_TRADING_DATE"),
            ("STOCK_SPLIT","UNRESOLVED_PROBE","SMDR",2023,1,"stock-splits","","REGULAR_MARKET_FIRST_NEW_BASIS_TRADING_DATE"),
          ]

          out = []
          for i, (family, role, ticker, year, month, endpoint, accepted, semantic) in enumerate(targets, 1):
              params = urllib.parse.urlencode({"year":year,"month":month,"page":1,"length":200,"search":ticker})
              url = f"https://api.zpi.web.id/v1/finance:idx/{endpoint}?{params}"
              req = urllib.request.Request(url, headers={"x-api-key":key,"Accept":"application/json","User-Agent":"IDX-Trade-INC001-TierA-Probe/1.1"})
              status, body, err, ctype = 0, b"", "", ""
              try:
                  with urllib.request.urlopen(req, timeout=40) as r:
                      status, body, ctype = int(r.status), r.read(), str(r.headers.get("Content-Type", ""))
              except urllib.error.HTTPError as e:
                  status, body, err = int(e.code), e.read(), f"HTTPError:{e.code}"
                  ctype = str(e.headers.get("Content-Type", "")) if e.headers else ""
              except Exception as e:
                  err = f"{type(e).__name__}:{e}"

              fn = f"{i:02d}_{endpoint}_{ticker}_{year}_{month:02d}.json"
              (raw / fn).write_bytes(body)
              sha = hashlib.sha256(body).hexdigest() if body else ""
              parsed, parse_error = None, ""
              if body:
                  try: parsed = json.loads(body.decode("utf-8"))
                  except Exception as e: parse_error = f"{type(e).__name__}:{e}"
              items = []
              if isinstance(parsed, dict):
                  if isinstance(parsed.get("items"), list): items = parsed["items"]
                  elif isinstance(parsed.get("data"), list): items = parsed["data"]

              row = {
                "family":family,"role":role,"ticker":ticker,"year":year,"month":month,
                "endpoint":endpoint,"accepted_transition":accepted,"accepted_semantic":semantic,
                "request_url_without_key":url,"http_status":status,"content_type":ctype,
                "response_bytes":len(body),"response_sha256":sha,"error":err,
                "parse_error":parse_error,"top_level_keys":sorted(parsed) if isinstance(parsed,dict) else [],
                "item_count":len(items),"items":items,"raw_file":f"raw/{fn}"
              }
              out.append(row)
              print("PROBE", family, role, ticker, f"{year}-{month:02d}", f"status={status}", f"items={len(items)}", f"sha256={sha}", f"error={err or '-'}")
              if isinstance(parsed, dict):
                  sample = items[0] if items else parsed
                  text = json.dumps(sample, ensure_ascii=True, sort_keys=True, separators=(",",":"))
                  print("SAMPLE", ticker, text[:2000])
              else:
                  print("NON_JSON", ticker, body[:500].decode("utf-8","replace"))

          probe = {"schema_version":"inc001_tier_a_zapi_capability_probe_v1","transport":"ZAPI","upstream_provider_claim":"IDX","read_only":True,"production_mutation":False,"call_count":len(out),"targets":out}
          (root / "probe.json").write_text(json.dumps(probe, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          manifest = {"probe_sha256":hashlib.sha256((root/"probe.json").read_bytes()).hexdigest(),"raw_sha256":{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(raw.glob("*.json"))}}
          (root / "MANIFEST.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("PROBE_MANIFEST", json.dumps(manifest, sort_keys=True))
          PY

      - name: Upload probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: inc001-tier-a-zapi-capability-probe-v1
          path: tier-a-zapi-probe/
          if-no-files-found: error
          retention-days: 14
