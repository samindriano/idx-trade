name: Zapi Dividends Bounded Audit V1

on:
  push:
    branches:
      - integration/forward-ca-attestation-v1
    paths:
      - '.github/workflows/zapi-dividends-audit-v1.yml'
  pull_request:
    branches:
      - research/idx-v4-x1-decision-v1
    paths:
      - '.github/workflows/zapi-dividends-audit-v1.yml'
      - 'scripts/probe_zapi_idx_dividends_v1.py'
      - 'scripts/review_zapi_idx_dividends_probe_v1.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ZAPI_API_KEY: ${{ secrets.ZAPI_API_KEY }}
      AUDIT_DIR: ${{ runner.temp }}/idx-zapi-dividends-probe-v1
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify secret presence without disclosure
        shell: bash
        run: |
          if [ -z "$ZAPI_API_KEY" ]; then
            echo 'ZAPI_API_KEY secret is missing or unavailable to this workflow.'
            exit 2
          fi
          echo 'ZAPI_API_KEY secret is available.'

      - name: Run exactly one authenticated BBCA dividends probe
        id: probe
        continue-on-error: true
        shell: bash
        run: |
          python scripts/probe_zapi_idx_dividends_v1.py \
            --output-dir "$AUDIT_DIR" \
            --code BBCA

      - name: Run offline semantic reviewer
        id: review
        if: steps.probe.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          python scripts/review_zapi_idx_dividends_probe_v1.py \
            --probe-dir "$AUDIT_DIR"

      - name: Print non-secret audit report
        if: always()
        shell: bash
        run: |
          echo '=== PROBE MANIFEST ==='
          if [ -f "$AUDIT_DIR/PROBE_MANIFEST.json" ]; then cat "$AUDIT_DIR/PROBE_MANIFEST.json"; else echo 'manifest missing'; fi
          echo '=== PROBE REVIEW ==='
          if [ -f "$AUDIT_DIR/PROBE_REVIEW.json" ]; then cat "$AUDIT_DIR/PROBE_REVIEW.json"; else echo 'review missing'; fi

      - name: Upload immutable audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zapi-dividends-bounded-audit-v1
          path: ${{ runner.temp }}/idx-zapi-dividends-probe-v1
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce audit result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.probe.outcome }}" != 'success' ]; then
            echo 'Probe failed; V1.1 remains blocked.'
            exit 2
          fi
          if [ "${{ steps.review.outcome }}" != 'success' ]; then
            echo 'Semantic review failed; V1.1 remains blocked.'
            exit 3
          fi
          echo 'Bounded audit passed its preregistered gate.'
