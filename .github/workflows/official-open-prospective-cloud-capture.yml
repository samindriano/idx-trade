name: Official Open prospective cloud archive

run-name: >-
  IDX-SLOT:${{
    (github.event.schedule == '2 2 * * 1-5' || inputs.slot == '0902') && 'OFFICIAL_OPEN_0902' ||
    (github.event.schedule == '12 2 * * 1-5' || inputs.slot == '0912') && 'OFFICIAL_OPEN_0912' ||
    (github.event.schedule == '22 2 * * 1-5' || inputs.slot == '0922') && 'OFFICIAL_OPEN_0922' ||
    'AMBIGUOUS_MANUAL'
  }}

on:
  schedule:
    # GitHub cron is UTC. These target 09:02 / 09:12 / 09:22 Asia/Jakarta.
    # GitHub scheduling can be delayed; the runner records the actual capture
    # timestamp and cloud evidence is never execution-admitted by this workflow.
    - cron: "2 2 * * 1-5"
    - cron: "12 2 * * 1-5"
    - cron: "22 2 * * 1-5"
  workflow_dispatch:
    inputs:
      slot:
        description: Official Open capture slot
        required: true
        type: choice
        options: ["0902", "0912", "0922"]
      session_date:
        description: Optional YYYY-MM-DD session date; blank uses current Jakarta date
        required: false
        default: ""
      scheduler_issued_at:
        description: Trusted external scheduler UTC issue timestamp
        required: false
        default: ""
        type: string
      scheduler_nonce:
        description: Trusted external scheduler nonce
        required: false
        default: ""
        type: string
      scheduler_signature:
        description: HMAC-SHA256 scheduler attestation signature
        required: false
        default: ""
        type: string

permissions:
  contents: read

# Native and trusted recovery runs intentionally have no workflow-level
# concurrency group. A hung native run must not hold a trusted recovery behind
# it until the prospective cutoff. Exactly-once durable authority is the
# conditional immutable slot_manifest.json commit; conflicting contenders
# fail closed instead of overwriting the winner.

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Immutable timing-gated recovery producer pin. Change only through reviewed integration.
      OFFICIAL_OPEN_CAPTURE_CODE_REF: ac29a0552b1785045906f8d608b5371d93e01b73
      ZAPI_API_KEY: ${{ secrets.ZAPI_API_KEY }}
      OFFICIAL_OPEN_STORAGE_BACKEND: s3
      OFFICIAL_OPEN_S3_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      OFFICIAL_OPEN_S3_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
      OFFICIAL_OPEN_S3_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      OFFICIAL_OPEN_S3_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      OFFICIAL_OPEN_STORAGE_PREFIX: official-open-v1
      DISPATCH_SLOT: ${{ inputs.slot || '' }}
      DISPATCH_SESSION_DATE: ${{ inputs.session_date || '' }}
      EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
      # Native schedule ignores these. workflow_dispatch is admitted only when
      # all fields verify against the shared scheduler HMAC key in producer V3.
      OFFICIAL_OPEN_SCHEDULER_ISSUED_AT: ${{ inputs.scheduler_issued_at || '' }}
      OFFICIAL_OPEN_SCHEDULER_NONCE: ${{ inputs.scheduler_nonce || '' }}
      OFFICIAL_OPEN_SCHEDULER_SIGNATURE: ${{ inputs.scheduler_signature || '' }}
      OFFICIAL_OPEN_SCHEDULER_HMAC_KEY: ${{ secrets.OFFICIAL_OPEN_SCHEDULER_HMAC_KEY }}

    steps:
      - name: Require accepted producer implementation pin
        shell: bash
        run: |
          test -n "$OFFICIAL_OPEN_CAPTURE_CODE_REF"
          [[ "$OFFICIAL_OPEN_CAPTURE_CODE_REF" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout pinned capture implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ env.OFFICIAL_OPEN_CAPTURE_CODE_REF }}
          persist-credentials: false

      - name: Verify pinned implementation
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$OFFICIAL_OPEN_CAPTURE_CODE_REF"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install capture runner
        run: python -m pip install -e ".[archive]"

      - name: Resolve capture parameters
        shell: bash
        run: |
          if [[ -n "$DISPATCH_SLOT" ]]; then
            slot="$DISPATCH_SLOT"
          else
            case "$EVENT_SCHEDULE" in
              "2 2 * * 1-5") slot="0902" ;;
              "12 2 * * 1-5") slot="0912" ;;
              "22 2 * * 1-5") slot="0922" ;;
              *) echo "Unknown schedule: $EVENT_SCHEDULE" >&2; exit 2 ;;
            esac
          fi
          echo "OFFICIAL_OPEN_SLOT=$slot" >> "$GITHUB_ENV"

      - name: Capture certified Official Open evidence to private R2
        shell: bash
        run: |
          set -o pipefail
          args=(--slot "$OFFICIAL_OPEN_SLOT")
          if [[ -n "$DISPATCH_SESSION_DATE" ]]; then
            args+=(--session-date "$DISPATCH_SESSION_DATE")
          fi
          python scripts/run_official_open_cloud_capture_v3.py "${args[@]}"
