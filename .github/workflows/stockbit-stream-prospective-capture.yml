name: Stockbit Stream prospective archive

on:
  schedule:
    - cron: "47 1 * * 1-5"
    - cron: "7 5 * * 1-5"
    - cron: "47 9 * * 1-5"
  workflow_dispatch:
    inputs:
      slot:
        description: Capture slot
        required: true
        type: choice
        options:
          - pre_open
          - midday
          - after_close

permissions:
  contents: read

concurrency:
  group: stockbit-stream-prospective-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ZAPI_API_KEY: ${{ secrets.ZAPI_API_KEY }}
      STOCKBIT_STREAM_HMAC_SALT: ${{ secrets.STOCKBIT_STREAM_AUTHOR_HMAC_KEY }}
      STOCKBIT_STREAM_STORAGE_BACKEND: s3
      STOCKBIT_STREAM_S3_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      STOCKBIT_STREAM_S3_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
      STOCKBIT_STREAM_S3_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      STOCKBIT_STREAM_S3_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      STOCKBIT_STREAM_STORAGE_PREFIX: stockbit-stream-v1
      DISPATCH_SLOT: ${{ inputs.slot || '' }}
      EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install archive runner
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,archive]"
      - name: Resolve scheduled slot
        shell: bash
        run: |
          if [[ -n "$DISPATCH_SLOT" ]]; then
            slot="$DISPATCH_SLOT"
          else
            case "$EVENT_SCHEDULE" in
              "47 1 * * 1-5") slot="pre_open" ;;
              "7 5 * * 1-5") slot="midday" ;;
              "47 9 * * 1-5") slot="after_close" ;;
              *) echo "Unknown schedule: $EVENT_SCHEDULE" >&2; exit 2 ;;
            esac
          fi
          echo "STOCKBIT_STREAM_SLOT=$slot" >> "$GITHUB_ENV"
      - name: Capture immutable stream archive
        run: >-
          python scripts/run_stockbit_stream_capture.py
          --universe-csv config/stockbit_stream_universe_v1.csv
          --universe-manifest config/stockbit_stream_universe_v1.json
          --slot "$STOCKBIT_STREAM_SLOT"
