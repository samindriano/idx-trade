name: Stockbit Stream prospective archive

on:
  schedule:
    # Social-stream evidence is prospective calendar-day data. The existing
    # runner still uses the latest valid completed IDX session for universe
    # ranking on weekends and exchange holidays.
    - cron: "47 1 * * *"  # 08:47 WIB, every calendar day
    - cron: "7 5 * * *"   # 12:07 WIB, every calendar day
    - cron: "47 9 * * *"  # 16:47 WIB, every calendar day
  workflow_dispatch:
    inputs:
      slot:
        description: Capture slot
        required: true
        type: choice
        options: [pre_open, midday, after_close]
      top_n:
        description: Manual universe size; routine schedule is frozen at 200
        required: false
        default: "200"

permissions:
  contents: read

concurrency:
  group: stockbit-stream-prospective-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ZAPI_API_KEY: ${{ secrets.ZAPI_API_KEY }}
      STOCKBIT_STREAM_HMAC_SALT: ${{ secrets.STOCKBIT_STREAM_AUTHOR_HMAC_KEY }}
      STOCKBIT_STREAM_STORAGE_BACKEND: s3
      STOCKBIT_STREAM_S3_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      STOCKBIT_STREAM_S3_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
      STOCKBIT_STREAM_S3_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      STOCKBIT_STREAM_S3_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      STOCKBIT_STREAM_STORAGE_PREFIX: stockbit-stream-v2
      DISPATCH_SLOT: ${{ inputs.slot || '' }}
      DISPATCH_TOP_N: ${{ inputs.top_n || '' }}
      EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install archive runner
        run: python -m pip install -e ".[archive]"
      - name: Resolve capture parameters
        shell: bash
        run: |
          if [[ -n "$DISPATCH_SLOT" ]]; then
            slot="$DISPATCH_SLOT"
            top_n="${DISPATCH_TOP_N:-200}"
          else
            top_n="200"
            case "$EVENT_SCHEDULE" in
              "47 1 * * *") slot="pre_open" ;;
              "7 5 * * *") slot="midday" ;;
              "47 9 * * *") slot="after_close" ;;
              *) echo "Unknown schedule: $EVENT_SCHEDULE" >&2; exit 2 ;;
            esac
          fi
          echo "STOCKBIT_STREAM_SLOT=$slot" >> "$GITHUB_ENV"
          echo "STOCKBIT_STREAM_TOP_N=$top_n" >> "$GITHUB_ENV"
      - name: Capture lean immutable stream archive
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_stockbit_stream_capture_v2.py \
            --identity-csv config/stockbit_stream_universe_v1.csv \
            --slot "$STOCKBIT_STREAM_SLOT" \
            --top-n "$STOCKBIT_STREAM_TOP_N"
