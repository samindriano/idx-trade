name: E2E security-master source smoke PR98

on:
  pull_request:
    branches:
      - integration/idx-e2e-baseline-paper-v1

permissions:
  contents: read

jobs:
  source-smoke:
    if: github.head_ref == 'fix/e2e-cloud-runtime-security-master-bootstrap-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package
        run: python -m pip install -e .

      - name: Live official IDX identity-source diagnostic
        shell: bash
        run: |
          python - <<'PY'
          import json

          from idx_trade.e2e_cloud_security_master_v1 import fetch_complete_active_listings
          from idx_trade.providers.idx import IDX_DELISTING_URL, _get_json

          active = fetch_complete_active_listings()
          params = {
              "urlName": "LINK_DELISTING",
              "periodYear": 2026,
              "periodMonth": 1,
              "periodType": "monthly",
              "isPrint": "False",
              "cumulative": "false",
              "pageSize": 9999,
              "pageNumber": 1,
              "orderBy": "",
          }
          payload = _get_json(IDX_DELISTING_URL, params)
          rows = payload.get("data") if isinstance(payload, dict) else None
          meta = payload.get("meta") if isinstance(payload, dict) else None
          print(json.dumps({
              "status": "LIVE_IDX_IDENTITY_SOURCE_META_DIAGNOSTIC",
              "active_rows": int(len(active)),
              "active_unique_tickers": int(active["ticker"].nunique()),
              "delisting_top_level_keys": sorted(payload.keys()) if isinstance(payload, dict) else [],
              "delisting_meta": meta,
              "delisting_row_count": len(rows) if isinstance(rows, list) else None,
              "delisting_first_row_keys": sorted(rows[0].keys()) if isinstance(rows, list) and rows and isinstance(rows[0], dict) else [],
              "outcome_accessed": False,
              "protected_forward_accessed": False,
              "model_refit": False,
              "r2_writes": 0,
          }, sort_keys=True, default=str))
          PY
