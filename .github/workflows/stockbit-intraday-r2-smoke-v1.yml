name: Stockbit Intraday R2 smoke

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Unique throwaway smoke run id
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STOCKBIT_INTRADAY_S3_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      STOCKBIT_INTRADAY_S3_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
      STOCKBIT_INTRADAY_S3_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      STOCKBIT_INTRADAY_S3_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout requested branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install archive dependency
        run: python -m pip install --upgrade pip && python -m pip install -e ".[archive]"

      - name: Run isolated ConditionalS3 smoke
        shell: bash
        env:
          SMOKE_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          case "$SMOKE_RUN_ID" in
            ""|*[!A-Za-z0-9_-]*) echo "Invalid smoke run id" >&2; exit 2 ;;
          esac
          python scripts/run_stockbit_intraday_r2_smoke_v1.py \
            --prefix "stockbit-intraday-smoke-v1/$SMOKE_RUN_ID"
