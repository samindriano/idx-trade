name: Stockbit identity refresh source audit

on:
  pull_request:
    paths:
      - "scripts/audit_stockbit_identity_refresh_source.py"
      - "scripts/audit_stockbit_identity_delta_followup.py"
      - "docs/checkpoints/2026-08-21_STOCKBIT_IDENTITY_REFRESH_SOURCE_AUDIT.md"
      - "config/stockbit_stream_universe_v1.csv"
      - "config/stockbit_stream_universe_v1.json"
      - ".github/workflows/stockbit-identity-refresh-source-audit.yml"

permissions:
  contents: read

jobs:
  live-identity-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install minimal audit dependency
        run: python -m pip install requests==2.34.2
      - name: Audit live IDX identity sources against pinned roster
        env:
          ZAPI_API_KEY: ${{ secrets.ZAPI_API_KEY }}
        run: python scripts/audit_stockbit_identity_refresh_source.py
      - name: Probe exact CNTX/CNTB/GOTOM identity semantics
        env:
          ZAPI_API_KEY: ${{ secrets.ZAPI_API_KEY }}
        run: python scripts/audit_stockbit_identity_delta_followup.py
