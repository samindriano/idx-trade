name: price-trend-runtime-bridge-adapter-validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/idx_trade/price_trend_state.py'
      - 'src/idx_trade/forward_price_trend_state.py'
      - 'src/idx_trade/forward_price_trend_state_verifier.py'
      - 'src/idx_trade/forward_price_trend_context_bridge.py'
      - 'src/idx_trade/forward_price_trend_context_anchor.py'
      - 'src/idx_trade/forward_price_trend_controlled_smoke.py'
      - 'tests/test_price_trend_state.py'
      - 'tests/test_price_trend_state_prospective.py'
      - 'tests/test_forward_price_trend_state.py'
      - 'tests/test_forward_price_trend_state_strict_verifier.py'
      - 'tests/test_forward_price_trend_context_bridge.py'
      - 'tests/test_forward_price_trend_context_anchor.py'
      - 'tests/test_forward_price_trend_controlled_smoke.py'
      - 'docs/checkpoints/2026-08-15_PRICE_TREND_RUNTIME_CONTEXT_PIN_V1.md'
      - 'docs/checkpoints/2026-08-15_PRICE_TREND_RUNTIME_BRIDGE_ADAPTER_V1.md'
      - '.github/workflows/price-trend-runtime-bridge-adapter-validation.yml'

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: pytest -q tests/test_price_trend_state.py tests/test_price_trend_state_prospective.py tests/test_forward_price_trend_state.py tests/test_forward_price_trend_state_strict_verifier.py tests/test_forward_price_trend_context_bridge.py tests/test_forward_price_trend_context_anchor.py tests/test_forward_price_trend_controlled_smoke.py
      - run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
