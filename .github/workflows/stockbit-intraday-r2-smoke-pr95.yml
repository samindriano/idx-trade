name: Stockbit Intraday R2 smoke PR95

on:
  pull_request:
    types: [synchronize, opened, reopened]

permissions:
  contents: read

jobs:
  r2-smoke:
    if: >-
      github.event.pull_request.number == 95 &&
      github.event.pull_request.head.ref == 'ops/stockbit-intraday-cloud-migration-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STOCKBIT_INTRADAY_S3_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      STOCKBIT_INTRADAY_S3_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
      STOCKBIT_INTRADAY_S3_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      STOCKBIT_INTRADAY_S3_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify exact PR head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install archive dependency
        run: python -m pip install --upgrade pip && python -m pip install -e ".[archive]"

      - name: Run isolated ConditionalS3 smoke
        shell: bash
        run: |
          set -euo pipefail
          prefix="stockbit-intraday-smoke-v1/pr95-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/run_stockbit_intraday_r2_smoke_v1.py --prefix "$prefix"
