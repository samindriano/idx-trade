name: foreign-flow-context-bridge-validation

on:
  pull_request:
    paths:
      - "src/idx_trade/forward_foreign_flow_context_bridge*.py"
      - "tests/test_forward_foreign_flow_context_bridge*.py"
      - "src/idx_trade/forward_foreign_flow_representation_v2.py"
      - "src/idx_trade/forward_foreign_flow_setup.py"
      - "tests/test_forward_foreign_flow_representation_v2.py"
      - "tests/test_forward_foreign_flow_setup.py"
      - ".github/workflows/foreign-flow-context-bridge-validation.yml"

jobs:
  focused-pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Focused tests
        run: >-
          python -m pytest -q
          tests/test_forward_foreign_flow_context_bridge.py
          tests/test_forward_foreign_flow_context_bridge_policy.py
          tests/test_forward_foreign_flow_context_bridge_plan.py
          tests/test_forward_foreign_flow_representation_v2.py
          tests/test_forward_foreign_flow_setup.py
