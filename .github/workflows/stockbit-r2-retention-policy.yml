name: Stockbit R2 retention policy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-retention-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply and verify bounded lifecycle policy
        run: python scripts/configure_stockbit_r2_retention_v1.py --config config/stockbit_r2_retention_v1.json --apply --verify
