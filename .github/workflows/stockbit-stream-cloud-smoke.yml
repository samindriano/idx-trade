name: Stockbit Stream isolated cloud smoke

on:
  workflow_dispatch:
    inputs:
      top_n:
        description: Small smoke universe size
        required: false
        default: "5"

permissions:
  contents: read

concurrency:
  group: stockbit-stream-cloud-smoke-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ZAPI_API_KEY: ${{ secrets.ZAPI_API_KEY }}
      STOCKBIT_STREAM_HMAC_SALT: ${{ secrets.STOCKBIT_STREAM_AUTHOR_HMAC_KEY }}
      STOCKBIT_STREAM_STORAGE_BACKEND: s3
      STOCKBIT_STREAM_S3_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      STOCKBIT_STREAM_S3_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
      STOCKBIT_STREAM_S3_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      STOCKBIT_STREAM_S3_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      # Hard isolation from the production stockbit-stream-v2 namespace.
      STOCKBIT_STREAM_STORAGE_PREFIX: stockbit-stream-smoke-v1/${{ github.run_id }}
      DISPATCH_TOP_N: ${{ inputs.top_n || '5' }}

    steps:
      - name: Checkout smoke branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install archive runner
        run: python -m pip install --upgrade pip && python -m pip install -e ".[archive]"

      - name: Prove isolated namespace
        shell: bash
        run: |
          set -euo pipefail
          [[ "$STOCKBIT_STREAM_STORAGE_PREFIX" == stockbit-stream-smoke-v1/* ]]
          [[ "$STOCKBIT_STREAM_STORAGE_PREFIX" != "stockbit-stream-v2" ]]
          [[ "$DISPATCH_TOP_N" =~ ^[0-9]+$ ]]
          test "$DISPATCH_TOP_N" -ge 1
          test "$DISPATCH_TOP_N" -le 10
          echo "Smoke prefix: $STOCKBIT_STREAM_STORAGE_PREFIX"
          echo "Smoke universe size: $DISPATCH_TOP_N"

      - name: Capture real isolated Stockbit Stream smoke
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_stockbit_stream_capture_v2.py \
            --identity-csv config/stockbit_stream_universe_v1.csv \
            --slot smoke \
            --top-n "$DISPATCH_TOP_N"
