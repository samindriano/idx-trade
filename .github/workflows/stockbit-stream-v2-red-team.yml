name: Stockbit Stream V2 red-team

on:
  pull_request:
    paths:
      - "src/idx_trade/stockbit_stream_capture_v2.py"
      - "src/idx_trade/stockbit_stream_archive.py"
      - "scripts/run_stockbit_stream_capture_v2.py"
      - "tests/test_stockbit_stream_v2_red_team.py"
      - ".github/workflows/stockbit-stream-prospective-capture.yml"
      - ".github/workflows/stockbit-stream-v2-red-team.yml"

permissions:
  contents: read

jobs:
  adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install audit dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,archive]"
      - name: Run Stockbit Stream V2 adversarial suite
        run: python -m pytest -q tests/test_stockbit_stream_v2_red_team.py
