name: Stockbit Intraday cloud production

run-name: >-
  IDX-SLOT:${{
    (github.event.schedule == '30 11 * * 1-5' || inputs.slot == '1830') && 'STOCKBIT_INTRADAY_1830' ||
    (github.event.schedule == '30 12 * * 1-5' || inputs.slot == '1930') && 'STOCKBIT_INTRADAY_1930' ||
    (github.event.schedule == '30 13 * * 1-5' || inputs.slot == '2030') && 'STOCKBIT_INTRADAY_2030' ||
    'AMBIGUOUS_MANUAL'
  }}

on:
  schedule:
    # GitHub cron is UTC: 18:30 / 19:30 / 20:30 Asia/Jakarta.
    - cron: "30 11 * * 1-5"
    - cron: "30 12 * * 1-5"
    - cron: "30 13 * * 1-5"
  workflow_dispatch:
    inputs:
      slot:
        description: Current-session post-close slot
        required: true
        type: choice
        options: [1830, 1930, 2030]

permissions:
  contents: read

concurrency:
  group: idx-trade-stockbit-intraday-production
  cancel-in-progress: false

jobs:
  capture:
    # Keep the cheap, provider-free preflight in the same hosted job as the
    # capture. A validated complete archive skips the accepted-E2E checkout,
    # Python setup, package install, and provider stage without paying for a
    # separately rounded hosted job.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      STOCKBIT_INTRADAY_STORAGE_BACKEND: s3
      STOCKBIT_INTRADAY_STORAGE_PREFIX: stockbit-intraday-v1
      STOCKBIT_INTRADAY_S3_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      STOCKBIT_INTRADAY_S3_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
      STOCKBIT_INTRADAY_S3_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      STOCKBIT_INTRADAY_S3_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      STOCKBIT_INTRADAY_E2E_PREFIX: e2e-paper-v1
      STOCKBIT_INTRADAY_E2E_INPUT_MANIFEST_KEY: inputs/manifest.json
      STOCKBIT_INTRADAY_ACCEPTED_E2E_ROOT: ${{ github.workspace }}/accepted-e2e
      # The checkout and verifier bind the run to one exact production tree.
      STOCKBIT_INTRADAY_EXPECTED_IMPLEMENTATION_REF: ${{ github.sha }}

    steps:
      - name: Checkout exact production implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact implementation checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Resolve scheduled slot
        id: resolve_slot
        shell: bash
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
          DISPATCH_SLOT: ${{ inputs.slot || '' }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            slot="$DISPATCH_SLOT"
          else
            case "$EVENT_SCHEDULE" in
              "30 11 * * 1-5") slot="1830" ;;
              "30 12 * * 1-5") slot="1930" ;;
              "30 13 * * 1-5") slot="2030" ;;
              *) echo "Unknown Stockbit Intraday schedule: $EVENT_SCHEDULE" >&2; exit 2 ;;
            esac
          fi
          case "$slot" in
            1830|1930|2030) ;;
            *) echo "Invalid Stockbit Intraday slot: $slot" >&2; exit 2 ;;
          esac
          echo "slot=$slot" >> "$GITHUB_OUTPUT"

      - name: Validate existing archive before capture bootstrap
        id: archive_check
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        shell: bash
        run: |
          set -euo pipefail
          output="$(mktemp)"
          python3 scripts/check_stockbit_intraday_completion.py --slot "${{ steps.resolve_slot.outputs.slot }}" | tee "$output"
          python3 - "$output" <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              result = json.load(handle)
          if result.get("status") == "COMPLETE" and result.get("capture_complete") is True:
              print("complete=true")
          elif result.get("status") == "NOT_COMPLETE" and result.get("capture_complete") is False:
              print("complete=false")
          else:
              raise SystemExit("unexpected completion probe result")
          PY

      - name: Checkout accepted E2E runtime bridge
        if: steps.archive_check.outputs.complete != 'true'
        uses: actions/checkout@v4
        with:
          ref: 043003ee9ae19f9ec6ad4c2db99ab1c19a1401f2
          path: accepted-e2e
          persist-credentials: false

      - name: Verify accepted E2E bridge checkout
        if: steps.archive_check.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C accepted-e2e rev-parse HEAD)" = "043003ee9ae19f9ec6ad4c2db99ab1c19a1401f2"
          test -z "$(git -C accepted-e2e status --porcelain=v1 --untracked-files=all)"

      - name: Setup Python
        if: steps.archive_check.outputs.complete != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install cloud runner
        if: steps.archive_check.outputs.complete != 'true'
        run: python -m pip install -e ".[archive]"

      - name: Export scheduled slot for capture
        if: steps.archive_check.outputs.complete != 'true'
        shell: bash
        run: echo "STOCKBIT_INTRADAY_SLOT=${{ steps.resolve_slot.outputs.slot }}" >> "$GITHUB_ENV"

      - name: Run one current-session cloud slot
        if: steps.archive_check.outputs.complete != 'true'
        env:
          ZAPI_API_KEY: ${{ secrets.ZAPI_API_KEY }}
        shell: bash
        run: python scripts/run_stockbit_intraday_cloud_v1.py --slot "$STOCKBIT_INTRADAY_SLOT"
